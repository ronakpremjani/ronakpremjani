<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24">
  <defs>
    <!-- Fade-in from both sides to center, invisible at edges -->
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A0A0A"  stop-opacity="1"/>
      <stop offset="8%"   stop-color="#2A2A2A"  stop-opacity="1"/>
      <stop offset="50%"  stop-color="#333333"  stop-opacity="1"/>
      <stop offset="92%"  stop-color="#2A2A2A"  stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A0A"  stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Main horizontal rule with gradient -->
  <rect x="0" y="11" width="900" height="1" fill="url(#divGrad)"/>

  <!-- Centered diamond accent -->
  <g transform="translate(450, 12)">
    <!-- Diamond shape -->
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <polygon points="0,-3 3,0 0,3 -3,0" fill="#60A5FA" opacity="0.6"/>
  </g>
</svg>
