<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <!-- Subtle dark gradient for window body -->
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <!-- Title bar gradient -->
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <!-- Glow for "Access Granted" and progress bar -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    /* ── Fonts ──────────────────────────────────────── */
    .t {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", "Menlo", monospace;
    }
    .tab-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      fill: #555555;
    }

    /* ── Color Classes ──────────────────────────────── */
    .dim      { fill: #666666; }
    .subtle   { fill: #444444; }
    .prompt   { fill: #60A5FA; }
    .cmd      { fill: #E6EDF3; }
    .ok       { fill: #3FB950; }
    .bar-fill { fill: #60A5FA; }
    .bar-bg   { fill: #1E1E1E; }
    .label    { fill: #8B949E; }
    .bright   { fill: #F8FAFC; }

    /* ── Font Sizes ─────────────────────────────────── */
    .s14 { font-size: 14px; }
    .s13 { font-size: 13px; }
    .s22 { font-size: 22px; font-weight: 600; }

    /* ── Animations ─────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    @keyframes growBar {
      from { width: 0; }
      to   { width: 600px; }
    }

    /* Staggered line appearances */
    .a0  { opacity:0; animation: fadeIn .15s ease forwards .4s;  }
    .a1  { opacity:0; animation: fadeIn .15s ease forwards 1.0s; }
    .a2  { opacity:0; animation: fadeIn .15s ease forwards 1.6s; }
    .a3  { opacity:0; animation: fadeIn .15s ease forwards 2.3s; }
    .a4  { opacity:0; animation: fadeIn .15s ease forwards 2.9s; }
    .a5  { opacity:0; animation: fadeIn .15s ease forwards 3.4s; }
    .a6  { opacity:0; animation: fadeIn .15s ease forwards 3.7s; }
    .a7  { opacity:0; animation: fadeIn .15s ease forwards 4.1s; }
    .a8  { opacity:0; animation: fadeIn .15s ease forwards 4.5s; }
    .a9  { opacity:0; animation: fadeIn .15s ease forwards 4.9s; }
    .a10 { opacity:0; animation: fadeIn .15s ease forwards 5.3s; }
    .a11 { opacity:0; animation: fadeIn .15s ease forwards 5.8s; }

    /* Progress bar animation */
    .bar-anim {
      width: 0;
      animation: growBar .8s ease forwards 3.5s;
    }

    /* Cursor blink */
    .cursor {
      opacity: 0;
      animation: fadeIn .1s ease forwards 6.2s, blink 1.1s step-end infinite 6.2s;
    }
  </style>

  <!-- ── Window Background ───────────────────────── -->
  <rect x="0" y="0" width="900" height="420" rx="12" fill="url(#winGrad)"/>
  <rect x="0" y="0" width="900" height="420" rx="12" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- ── Title Bar ───────────────────────────────── -->
  <rect x="1" y="1" width="898" height="40" rx="12" fill="url(#hdrGrad)"/>
  <rect x="1" y="29" width="898" height="12" fill="#0A0A0A"/>
  <line x1="1" y1="41" x2="899" y2="41" stroke="#242424" stroke-width="1"/>

  <!-- Traffic light dots -->
  <circle cx="24" cy="21" r="6.5" fill="#FF5F56"/>
  <circle cx="45" cy="21" r="6.5" fill="#FFBD2E"/>
  <circle cx="66" cy="21" r="6.5" fill="#27C93F"/>

  <!-- Tab label -->
  <text x="450" y="26" class="tab-label" text-anchor="middle">visitor@ronak — bash — 100×28</text>

  <!-- ── Terminal Content ────────────────────────── -->
  <g class="t s14" transform="translate(36, 76)">

    <!-- Line 01 · ssh command -->
    <text class="a0">
      <tspan class="prompt">visitor@local</tspan>
      <tspan class="dim">:</tspan>
      <tspan class="prompt">~</tspan>
      <tspan class="dim">$ </tspan>
      <tspan class="cmd">ssh visitor@ronak</tspan>
    </text>

    <!-- Line 02 · Connecting -->
    <text y="30" class="a1 dim">Connecting to ronak.dev...</text>

    <!-- Line 03 · Authenticating -->
    <text y="58" class="a2 dim">Authenticating with public key...</text>

    <!-- Line 04 · Access Granted -->
    <text y="88" class="a3 ok s14" filter="url(#glow)">Access Granted.</text>

    <!-- Line 05 · blank spacer visual -->
    <!-- Line 06 · Boot message -->
    <text y="124" class="a4 cmd">Booting RonakOS v2.0...</text>

    <!-- Line 07 · Progress bar (background track + animated fill) -->
    <g class="a5" transform="translate(0, 143)">
      <rect x="0" y="0" width="600" height="14" rx="2" class="bar-bg"/>
      <rect class="bar-fill bar-anim" x="0" y="0" height="14" rx="2"/>
      <text x="614" y="11" class="dim s13">100%</text>
    </g>

    <!-- Line 08–11 · Module loaders -->
    <text y="182" class="a6 dim">
      <tspan class="subtle">Loading</tspan> Projects<tspan class="subtle">............</tspan>
      <tspan class="ok"> OK</tspan>
    </text>
    <text y="206" class="a7 dim">
      <tspan class="subtle">Loading</tspan> Skills<tspan class="subtle">..................</tspan>
      <tspan class="ok"> OK</tspan>
    </text>
    <text y="230" class="a8 dim">
      <tspan class="subtle">Loading</tspan> GitHub<tspan class="subtle">.................</tspan>
      <tspan class="ok"> OK</tspan>
    </text>
    <text y="254" class="a9 dim">
      <tspan class="subtle">Loading</tspan> Developer<tspan class="subtle">.............</tspan>
      <tspan class="ok"> OK</tspan>
    </text>

    <!-- Line 12 · Ready -->
    <text y="298" class="a10 bright s22">System Ready.</text>

    <!-- Line 13 · Prompt + cursor -->
    <g class="a11" transform="translate(0, 330)">
      <text>
        <tspan class="prompt">visitor@ronak</tspan>
        <tspan class="dim">:</tspan>
        <tspan class="prompt">~</tspan>
        <tspan class="dim">$ </tspan>
      </text>
    </g>
    <text x="148" y="330" class="cursor cmd">▊</text>

  </g>
</svg>
