<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80">
  <defs>
    <linearGradient id="tWinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="tHdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <style>
    .ttt {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", monospace;
      font-size: 13px;
    }
    .tab-t  { font-family: sans-serif; font-size: 12px; fill: #555555; }
    .tp { fill: #60A5FA; }
    .td { fill: #555555; }
    .tc { fill: #E6EDF3; }

    @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0; } }
    .tcursor { animation: blink 1.1s step-end infinite; fill: #60A5FA; }
  </style>

  <rect x="0" y="0" width="900" height="80" rx="8" fill="url(#tWinGrad)"/>
  <rect x="0" y="0" width="900" height="80" rx="8" fill="none" stroke="#242424" stroke-width="1"/>
  <rect x="1" y="1" width="898" height="30" rx="8" fill="url(#tHdrGrad)"/>
  <rect x="1" y="23" width="898" height="8" fill="#0A0A0A"/>
  <line x1="1" y1="31" x2="899" y2="31" stroke="#242424" stroke-width="1"/>

  <circle cx="20" cy="16" r="5" fill="#FF5F56"/>
  <circle cx="38" cy="16" r="5" fill="#FFBD2E"/>
  <circle cx="56" cy="16" r="5" fill="#27C93F"/>

  <text x="450" y="21" class="tab-t" text-anchor="middle">visitor@ronak — bash</text>

  <g class="ttt" transform="translate(28, 58)">
    <text>
      <tspan class="tp">visitor@ronak</tspan>
      <tspan class="td">:</tspan>
      <tspan class="tp">~</tspan>
      <tspan class="td">$ </tspan>
      <tspan class="tc">_</tspan>
    </text>
    <text x="148" class="tcursor td">▊</text>
  </g>
</svg>
