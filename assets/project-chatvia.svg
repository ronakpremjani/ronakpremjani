<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320">
  <defs>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <!-- Blue accent glow top border -->
    <linearGradient id="borderGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#60A5FA" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .ct {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", monospace;
    }
    .card-dim    { fill: #555555; font-size: 11px; }
    .card-label  { fill: #8B949E; font-size: 12px; }
    .card-title  { fill: #F8FAFC; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .card-desc   { fill: #9CA3AF; font-size: 12.5px; }
    .card-tag    { fill: #60A5FA; font-size: 11px; }
    .card-status { fill: #3FB950; font-size: 11px; }
    .card-link   { fill: #60A5FA; font-size: 11.5px; }
    .card-sep    { fill: #222222; }
  </style>

  <!-- Card base -->
  <rect x="0" y="0" width="440" height="320" rx="10" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
  <!-- Outer border -->
  <rect x="0" y="0" width="440" height="320" rx="10" fill="none" stroke="#242424" stroke-width="1"/>
  <!-- Blue top border accent -->
  <rect x="30" y="0" width="380" height="1.5" rx="1" fill="url(#borderGrad1)"/>

  <!-- Header area -->
  <g class="ct" transform="translate(24, 28)">

    <!-- Type label -->
    <text class="card-dim">◈  PROJECT · 01</text>

    <!-- Status pill -->
    <rect x="290" y="-14" width="120" height="20" rx="10" fill="#0D2818"/>
    <rect x="290" y="-14" width="120" height="20" rx="10" fill="none" stroke="#1A4A2A" stroke-width="1"/>
    <text x="302" y="-1" class="ct card-status">● IN PROGRESS</text>

    <!-- Project name -->
    <text y="36" class="ct card-title">Chatvia</text>

    <!-- Short tagline -->
    <text y="58" class="ct card-desc">Real-time chat platform built for speed and clarity.</text>

  </g>

  <!-- Separator -->
  <line x1="24" y1="102" x2="416" y2="102" stroke="#1E1E1E" stroke-width="1"/>

  <!-- Features list -->
  <g class="ct" transform="translate(24, 122)">
    <text class="card-label">FEATURES</text>

    <text y="22" class="ct card-desc">→  Real-time messaging via WebSockets</text>
    <text y="40" class="ct card-desc">→  Authentication &amp; protected routes</text>
    <text y="58" class="ct card-desc">→  Online presence indicators</text>
    <text y="76" class="ct card-desc">→  Responsive UI with Tailwind CSS</text>
  </g>

  <!-- Separator -->
  <line x1="24" y1="218" x2="416" y2="218" stroke="#1E1E1E" stroke-width="1"/>

  <!-- Tech tags -->
  <g transform="translate(24, 234)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="68" height="22" rx="4" fill="#0D1E33"/>
    <rect x="0" y="0" width="68" height="22" rx="4" fill="none" stroke="#1E3A5A" stroke-width="1"/>
    <text x="8" y="15" class="ct card-tag">React.js</text>

    <!-- Tag 2 -->
    <rect x="76" y="0" width="66" height="22" rx="4" fill="#0D1E33"/>
    <rect x="76" y="0" width="66" height="22" rx="4" fill="none" stroke="#1E3A5A" stroke-width="1"/>
    <text x="84" y="15" class="ct card-tag">Node.js</text>

    <!-- Tag 3 -->
    <rect x="150" y="0" width="82" height="22" rx="4" fill="#0D1E33"/>
    <rect x="150" y="0" width="82" height="22" rx="4" fill="none" stroke="#1E3A5A" stroke-width="1"/>
    <text x="158" y="15" class="ct card-tag">Socket.io</text>

    <!-- Tag 4 -->
    <rect x="240" y="0" width="74" height="22" rx="4" fill="#0D1E33"/>
    <rect x="240" y="0" width="74" height="22" rx="4" fill="none" stroke="#1E3A5A" stroke-width="1"/>
    <text x="248" y="15" class="ct card-tag">MongoDB</text>
  </g>

  <!-- Separator -->
  <line x1="24" y1="276" x2="416" y2="276" stroke="#1E1E1E" stroke-width="1"/>

  <!-- Footer links -->
  <g class="ct" transform="translate(24, 296)">
    <text class="ct card-link">⌥  View Repo</text>
    <text x="220" class="ct card-dim">→  github.com/ronakpremjani/chatvia</text>
  </g>
</svg>
